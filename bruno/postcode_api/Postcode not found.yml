info:
  name: Postcode not found
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/postcodes/ZA11ZZ
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("body has message", function () {
          expect(res.getBody()).to.have.property("message");
          });

        test("404 status code", function () {
          expect(res.getStatus()).to.eql(404);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.message
      operator: eq
      value: '"Postcode not found."'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
